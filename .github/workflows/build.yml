name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Langkah untuk mengekstrak file ZIP pendukung di root utama
      - name: Ekstrak file ZIP
        run: |
          unzip bombanana.zip
          echo "=== Isi root folder setelah unzip ==="
          ls -la

      # Maven otomatis mendeteksi pom.xml di root utama karena sudah Anda pindahkan
      - name: Build dengan Maven
        run: mvn -B -ntp package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Bombanana
          path: target/Bombanana-*.jar

      - name: Buat GitHub Release (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/Bombanana-*.jar
          generate_release_notes: true
          
