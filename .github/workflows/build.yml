name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 1. Mengekstrak file spesifik bombanana.zip
      - name: Ekstrak file bombanana.zip
        run: |
          unzip bombanana.zip
          echo "=== Struktur direktori setelah diekstrak ==="
          ls -R

      # 2. Build Maven dengan pencarian dinamis (mencegah error sub-folder)
      - name: Build dengan Maven
        run: |
          # Mencari lokasi asli pom.xml yang baru saja diekstrak
          POM_PATH=$(find . -name "pom.xml" -not -path "*/target/*" | head -n 1)
          
          if [ -z "$POM_PATH" ]; then
            echo "Error: File pom.xml tetap tidak ditemukan setelah unzip!"
            exit 1
          fi
          
          echo "Menemukan pom.xml di: $POM_PATH"
          # Menjalankan build menggunakan path pom.xml yang ditemukan
          mvn -B -ntp package --file "$POM_PATH"

      # 3. Upload hasil build .jar
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Bombanana
          # Menyesuaikan pencarian target/*.jar di sub-folder manapun
          path: "**/target/Bombanana-*.jar"

      # 4. Buat GitHub Release
      - name: Buat GitHub Release (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "**/target/Bombanana-*.jar"
          generate_release_notes: true
          
