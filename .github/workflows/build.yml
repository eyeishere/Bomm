name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # === LANGKAH BARU: Ekstrak file zip otomatis ===
      - name: bombanana.zip
        run: |
          # Perintah ini akan mencari file .zip apa saja di repository dan mengekstraknya
          unzip *.zip
          
          # Baris di bawah ini opsional untuk memastikan file berhasil diekstrak
          echo "Isi direktori setelah unzip:"
          ls -la

      - name: Build dengan Maven
        # Jika setelah di-unzip pom.xml berada di dalam sub-folder (misal: Bomm), 
        # tambahkan argumen `--file nama-folder/pom.xml` setelah kata package
        run: mvn -B -ntp package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Bombanana
          path: target/Bombanana-*.jar

      - name: Buat GitHub Release (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/Bombanana-*.jar
          generate_release_notes: true
          
